[project]
name = "spine-mcp"
version = "0.1.0"
description = "Warm-start query layer over a project's Agents Protocol documentation spine"
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Stephen Phillips" },
    { name = "HappyMonkeyAI" },
]
urls = { Homepage = "https://github.com/HappyMonkeyAI/spine-mcp", Repository = "https://github.com/HappyMonkeyAI/spine-mcp" }
dependencies = [
    "mcp>=1.0.0,<2",  # 2.x renamed FastMCP to MCPServer; siblings are still on 1.x
    "Pillow>=10",     # spine-design: image validation, webp, diffs, crops
]

[project.optional-dependencies]
# spine-design headless adapter (CI / Linux hosts). Use an installed browser via
# browser_channel = "chrome"|"msedge", or `uv run playwright install chromium`.
playwright = ["playwright>=1.40"]

[project.scripts]
spine-mcp = "spine_mcp.server:main"
spine = "spine_mcp.cli:main"
spine-design-mcp = "spine_design.server:main"
spine-design = "spine_design.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/spine_core", "src/spine_mcp", "src/spine_design"]
